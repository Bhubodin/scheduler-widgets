<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Focus Timer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919;          /* Notion dark background */
    --surface: #211d1a;
    --text: #e9dfd3;
    --muted: #8a7d70;
    --accent: #c99a6b;
    --accent-text: #1c1612;
    --chip: #2e2722;
    --hover: #3a3029;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    color: var(--text);
    display: flex;
    -webkit-font-smoothing: antialiased;
  }
  .timer {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border-radius: 10px;
    padding: clamp(14px, 4vw, 22px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: clamp(10px, 3vw, 16px);
  }
  button { font-family: inherit; cursor: pointer; border: none; }

  .tabs {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .tab {
    background: var(--chip);
    color: var(--muted);
    padding: 8px 0;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    transition: background .2s, color .2s;
  }
  .tab:hover { background: var(--hover); }
  .tab.active { background: var(--accent); color: var(--accent-text); }

  .clock-row {
    display: flex;
    align-items: center;
    gap: clamp(8px, 3vw, 16px);
  }
  .adj {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--chip);
    color: var(--muted);
    font-size: 16px;
    line-height: 1;
  }
  .adj:hover { background: var(--hover); color: var(--text); }
  .adj:disabled { opacity: .3; cursor: default; }
  .clock {
    font-size: clamp(40px, 15vw, 64px);
    font-weight: 800;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .label { font-size: 12px; color: var(--muted); margin-top: -6px; }

  .progress {
    width: 100%;
    height: 3px;
    background: var(--chip);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar { height: 100%; width: 0; background: var(--accent); transition: width .3s linear; }

  .actions { display: flex; gap: 8px; }
  .btn {
    padding: 8px 22px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
  }
  .primary { background: var(--accent); color: var(--accent-text); }
  .primary:hover { filter: brightness(1.08); }
  .secondary { background: var(--chip); color: var(--text); }
  .secondary:hover { background: var(--hover); }
</style>
</head>
<body>
  <div class="timer">
    <div class="tabs">
      <button class="tab active" data-mode="focus">Focus</button>
      <button class="tab" data-mode="break">Break</button>
    </div>

    <div class="clock-row">
      <button class="adj" id="minus" aria-label="Decrease 5 minutes">−</button>
      <div class="clock" id="clock">25:00</div>
      <button class="adj" id="plus" aria-label="Increase 5 minutes">+</button>
    </div>
    <div class="label" id="label">Focus time</div>

    <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="actions">
      <button class="btn primary" id="start">Start</button>
      <button class="btn secondary" id="reset">Reset</button>
    </div>
  </div>

<script>
  const lengths = { focus: 25, break: 5 }; // minutes
  let mode = "focus";
  let remaining = lengths.focus * 60;      // seconds
  let endAt = null;                        // timestamp when running
  let tick = null;

  const $ = id => document.getElementById(id);

  function fmt(s) {
    const m = Math.floor(s / 60), sec = s % 60;
    return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
  }

  function draw() {
    $("clock").textContent = fmt(remaining);
    $("label").textContent = mode === "focus" ? "Focus time" : "Break time";
    const total = lengths[mode] * 60;
    $("bar").style.width = `${((total - remaining) / total) * 100}%`;
    $("start").textContent = tick ? "Pause" : (remaining < total ? "Resume" : "Start");
    $("minus").disabled = $("plus").disabled = !!tick;
    document.querySelectorAll(".tab").forEach(t =>
      t.classList.toggle("active", t.dataset.mode === mode));
  }

  function chime() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.25, 0.5].forEach((d, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = [660, 880, 990][i];
        g.gain.setValueAtTime(0.0001, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + d + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + d + 0.4);
        o.connect(g).connect(ctx.destination);
        o.start(ctx.currentTime + d);
        o.stop(ctx.currentTime + d + 0.45);
      });
    } catch (e) {}
  }

  function stop() { clearInterval(tick); tick = null; endAt = null; }

  function setMode(m) {
    stop();
    mode = m;
    remaining = lengths[m] * 60;
    draw();
  }

  function start() {
    endAt = Date.now() + remaining * 1000;
    tick = setInterval(() => {
      remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000));
      if (remaining === 0) {
        chime();
        setMode(mode === "focus" ? "break" : "focus"); // auto-switch
        return;
      }
      draw();
    }, 250);
  }

  $("start").onclick = () => { tick ? stop() : start(); draw(); };
  $("reset").onclick = () => setMode(mode);
  $("minus").onclick = () => { lengths[mode] = Math.max(5, lengths[mode] - 5); setMode(mode); };
  $("plus").onclick  = () => { lengths[mode] = Math.min(90, lengths[mode] + 5); setMode(mode); };
  document.querySelectorAll(".tab").forEach(t => t.onclick = () => setMode(t.dataset.mode));

  draw();
</script>
</body>
</html>
