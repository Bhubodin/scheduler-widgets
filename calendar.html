<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #191919;          /* Notion dark background */
    --surface: #211d1a;     /* warm card tone */
    --text: #e9dfd3;
    --muted: #6f655c;
    --accent: #c99a6b;      /* tan */
    --accent-text: #1c1612;
    --hover: #2e2722;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: "Playfair Display", Georgia, "Times New Roman", serif;
    color: var(--text);
    display: flex;
    -webkit-font-smoothing: antialiased;
  }
  .cal {
    width: 100%;
    height: 100%;
    background: var(--surface);
    border-radius: 10px;
    padding: clamp(12px, 4vw, 22px);
    display: flex;
    flex-direction: column;
    gap: clamp(8px, 2.5vw, 14px);
  }
  .head {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .title {
    font-size: clamp(15px, 4.6vw, 20px);
    font-weight: 700;
    letter-spacing: 0.3px;
  }
  .nav {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 18px;
    width: 30px; height: 30px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    line-height: 1;
  }
  .nav:hover { background: var(--hover); }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-auto-rows: 1fr;
    gap: 3px;
    text-align: center;
  }
  .dow {
    font-size: clamp(10px, 2.8vw, 12px);
    font-weight: 700;
    color: var(--muted);
    display: flex; align-items: center; justify-content: center;
    text-transform: uppercase;
  }
  .day {
    font-size: clamp(11px, 3.4vw, 14px);
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    min-height: 26px;
  }
  .day.other { color: var(--muted); opacity: 0.55; }
  .day:not(.other):hover { background: var(--hover); }
  .day.today {
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="cal">
    <div class="head">
      <button class="nav" id="prev" aria-label="Previous month">‹</button>
      <div class="title" id="title"></div>
      <button class="nav" id="next" aria-label="Next month">›</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>

<script>
  const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW = ["M","T","W","T","F","S","S"]; // week starts Monday
  const today = new Date();
  let view = new Date(today.getFullYear(), today.getMonth(), 1);

  function render() {
    const grid = document.getElementById("grid");
    const y = view.getFullYear(), m = view.getMonth();
    document.getElementById("title").textContent = `${MONTHS[m]} ${y}`;
    grid.innerHTML = DOW.map(d => `<div class="dow">${d}</div>`).join("");

    const offset = (new Date(y, m, 1).getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    const daysPrev = new Date(y, m, 0).getDate();
    const totalCells = Math.ceil((offset + daysInMonth) / 7) * 7;

    let html = "";
    for (let i = 0; i < totalCells; i++) {
      const n = i - offset + 1;
      if (n < 1) html += `<div class="day other">${daysPrev + n}</div>`;
      else if (n > daysInMonth) html += `<div class="day other">${n - daysInMonth}</div>`;
      else {
        const isToday = n === today.getDate() && m === today.getMonth() && y === today.getFullYear();
        html += `<div class="day${isToday ? " today" : ""}">${n}</div>`;
      }
    }
    grid.insertAdjacentHTML("beforeend", html);
  }

  document.getElementById("prev").onclick = () => { view.setMonth(view.getMonth() - 1); render(); };
  document.getElementById("next").onclick = () => { view.setMonth(view.getMonth() + 1); render(); };
  render();
</script>
</body>
</html>
